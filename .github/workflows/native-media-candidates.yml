name: Manual native media candidates

on:
  workflow_dispatch:
    inputs:
      apple:
        description: Build Apple FFmpeg maintenance with the retained custom mpv stack
        type: boolean
        default: true
      android:
        description: Build Android media-stack candidate AAR
        type: boolean
        default: true
  workflow_call:
    inputs:
      apple:
        type: boolean
        default: true
      android:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: native-media-candidates-${{ github.ref }}-${{ inputs.apple }}-${{ inputs.android }}
  cancel-in-progress: false

jobs:
  apple:
    if: inputs.apple
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed recipes
        run: |
          set -euo pipefail
          printf '%s  %s\n' b5a4cf9d8d4af22065850ce471a09478d2f5d162d001388d614e1265ca48cb6a scripts/native-media-hosted/inputs.sha256 | shasum -a 256 -c -
          shasum -a 256 -c scripts/native-media-hosted/inputs.sha256
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mpvkit/MPVKit
          ref: 2103893078c5e339073b11737b86f7f22b9c4491
          path: _native-mpvkit
          persist-credentials: false
      - name: Prepare hosted build tools
        run: |
          set -euo pipefail
          brew install meson ninja cmake pkg-config nasm wget jq autoconf automake libtool sdl2
      - name: Build unpromoted Apple candidate
        run: |
          set -euo pipefail
          mkdir -p _build/native-media/apple
          bash scripts/native-media-hosted/build.sh apple 2>&1 | tee _build/native-media/apple/build.log
      - name: Retain candidate and evidence even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-media-apple-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/native-media/apple/*.tar*
            _build/native-media/apple/*.json
            _build/native-media/apple/*.txt
            _build/native-media/apple/*.log
            _build/native-media/apple/*.patch
            _build/native-media/apple/*.sha256
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn

  android:
    if: inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed recipes
        run: |
          set -euo pipefail
          printf '%s  %s\n' b5a4cf9d8d4af22065850ce471a09478d2f5d162d001388d614e1265ca48cb6a scripts/native-media-hosted/inputs.sha256 | shasum -a 256 -c -
          shasum -a 256 -c scripts/native-media-hosted/inputs.sha256
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jarnedemeulemeester/libmpv-android
          ref: fcf6745703dc1265bca88f12fee8fc355ddf251e
          path: _native-publisher
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare hosted build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake pkgconf libtool ninja-build meson python3-jinja2 gperf nasm cmake python3-venv
          # Fontconfig 2.18.3 requires Meson >=1.11; keep distro Python/packages untouched.
          tools="$RUNNER_TEMP/vortx-native-media-tools"
          [[ ! -e "$tools" && ! -L "$tools" ]] || exit 1
          python3 -m venv "$tools"
          "$tools/bin/python" -m pip --disable-pip-version-check install --no-index --no-deps --only-binary=:all: \
            'https://files.pythonhosted.org/packages/57/99/36cd25f9598eef70db97577440a70a360af505f6f01c2338a18d1556079c/meson-1.12.1-py3-none-any.whl#sha256=930bc7542cbd9f57009e182fd014eba48cf1a0180a7b9006d2d32d8f168d8b02'
          echo "$tools/bin" >> "$GITHUB_PATH"
      - name: Build unpromoted Android candidate
        run: |
          set -euo pipefail
          mkdir -p _build/native-media/android
          bash scripts/native-media-hosted/build.sh android 2>&1 | tee _build/native-media/android/build.log
      - name: Retain candidate and evidence even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-media-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/native-media/android/*
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn
